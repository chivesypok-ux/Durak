<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Змейка</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:#0b1f17;color:#fff;font-family:system-ui,sans-serif;overflow:hidden;touch-action:none}
#app{height:100%;display:flex;flex-direction:column;align-items:center;padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
#hud{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:520px;padding:4px 8px 8px;font-weight:800}
#hud .sc{font-size:26px;color:#c8ff6a;text-shadow:0 0 12px #7bd13a88}
#hud .hi{font-size:14px;opacity:.75}
#wrap{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;position:relative}
canvas{border-radius:16px;box-shadow:0 0 0 3px #1f5a3a,0 10px 30px #000a}
#msg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:24px;font-weight:800;text-shadow:0 2px 10px #000;pointer-events:none;gap:8px;white-space:pre-line}
#msg small{font-size:15px;font-weight:500;opacity:.85}
</style></head><body>
<div id="app">
<div id="hud"><span class="sc" id="sc">0</span><span class="hi" id="hi"></span></div>
<div id="wrap"><canvas id="c"></canvas><div id="msg"></div></div>
</div>
<script>
try{Telegram.WebApp.ready();Telegram.WebApp.expand();Telegram.WebApp.disableVerticalSwipes&&Telegram.WebApp.disableVerticalSwipes()}catch(e){}
const $=id=>document.getElementById(id);
const cv=$('c'),ctx=cv.getContext('2d');
const COLS=17;
let CS=20,ROWS=24,DPR=1;
let snake,prev,dir,queue,food,bonus,score,hi=0,state='ready',stepMs,acc,parts,level,grow;
try{hi=+localStorage.getItem('snake_hi')||0}catch(e){}
const DIRS={u:[0,-1],d:[0,1],l:[-1,0],r:[1,0]};
function size(){
  const w=$('wrap').clientWidth,h=$('wrap').clientHeight;
  CS=Math.floor(Math.min(w/COLS,52));
  CS=Math.max(14,CS);
  ROWS=Math.max(12,Math.floor(h/CS));
  DPR=window.devicePixelRatio||1;
  cv.width=COLS*CS*DPR;cv.height=ROWS*CS*DPR;
  cv.style.width=COLS*CS+'px';cv.style.height=ROWS*CS+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
function reset(){
  const cx=Math.floor(COLS/2),cy=Math.floor(ROWS/2);
  snake=[[cx,cy],[cx,cy+1],[cx,cy+2]];prev=snake.map(s=>s.slice());
  dir=[0,-1];queue=[];score=0;stepMs=150;acc=0;parts=[];grow=0;bonus=null;level=1;
  placeFood();state='ready';
  $('msg').innerHTML='🐍 Змейка<small>Свайпни пальцем, чтобы начать</small>';
  $('sc').textContent=0;showHi();
}
function showHi(){$('hi').textContent='Рекорд '+hi}
function free(x,y){return !snake.some(s=>s[0]===x&&s[1]===y)&&!(food&&food[0]===x&&food[1]===y)&&!(bonus&&bonus.x===x&&bonus.y===y)}
function randCell(){for(let i=0;i<500;i++){const x=Math.floor(Math.random()*COLS),y=Math.floor(Math.random()*ROWS);if(free(x,y))return [x,y];}return null}
function placeFood(){food=randCell()}
function turn(d){
  if(state==='over'){return;}
  if(state==='ready'){state='play';$('msg').innerHTML='';}
  const last=queue.length?queue[queue.length-1]:dir;
  if(d[0]===-last[0]&&d[1]===-last[1])return;   // нельзя развернуться назад
  if(d[0]===last[0]&&d[1]===last[1])return;
  if(queue.length<2)queue.push(d);
}
function burst(x,y,col,n=14){
  for(let i=0;i<n;i++){const a=Math.random()*6.28,v=1+Math.random()*3;parts.push({x:(x+.5)*CS,y:(y+.5)*CS,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:1,c:col});}
}
function step(){
  if(queue.length)dir=queue.shift();
  prev=snake.map(s=>s.slice());
  const h=[snake[0][0]+dir[0],snake[0][1]+dir[1]];
  const tail=snake[snake.length-1];
  const willGrow=grow>0;
  const hit=h[0]<0||h[1]<0||h[0]>=COLS||h[1]>=ROWS||snake.some((s,i)=>s[0]===h[0]&&s[1]===h[1]&&(willGrow||i!==snake.length-1));
  if(hit){die();return;}
  snake.unshift(h);
  prev.unshift(prev[0].slice());
  if(grow>0){grow--;}else{snake.pop();prev.pop();}
  if(food&&h[0]===food[0]&&h[1]===food[1]){
    score+=10;grow+=1;burst(h[0],h[1],'#ff5a4d');placeFood();
    if(!bonus&&score%50===0){const c=randCell();if(c)bonus={x:c[0],y:c[1],t:60};}
    stepMs=Math.max(70,150-Math.floor(score/30)*6);
    try{Telegram.WebApp.HapticFeedback.impactOccurred('light')}catch(e){}
    upd();
  }else if(bonus&&h[0]===bonus.x&&h[1]===bonus.y){
    score+=50;grow+=2;burst(h[0],h[1],'#ffd84a',24);bonus=null;upd();
    try{Telegram.WebApp.HapticFeedback.impactOccurred('medium')}catch(e){}
  }
  if(bonus&&--bonus.t<=0)bonus=null;
}
function upd(){$('sc').textContent=score;if(score>hi){hi=score;try{localStorage.setItem('snake_hi',hi)}catch(e){}showHi();}}
function die(){
  state='over';burst(snake[0][0],snake[0][1],'#c8ff6a',30);
  try{Telegram.WebApp.HapticFeedback.notificationOccurred('error')}catch(e){}
  $('msg').innerHTML='Игра окончена<small>Счёт '+score+(score&&score>=hi?' — новый рекорд! 🏆':'')+'<br>Тап — играть снова</small>';
}

// ---- рисование ----
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function drawBG(){
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){
    ctx.fillStyle=(x+y)%2?'#12301f':'#143523';ctx.fillRect(x*CS,y*CS,CS,CS);
  }
}
function drawApple(x,y,t){
  const cx=(x+.5)*CS,cy=(y+.5)*CS,r=CS*.38*(1+Math.sin(t*5)*.04);
  const g=ctx.createRadialGradient(cx-r*.3,cy-r*.3,r*.1,cx,cy,r);g.addColorStop(0,'#ff8a7a');g.addColorStop(1,'#d62a1f');
  ctx.fillStyle='#00000040';ctx.beginPath();ctx.ellipse(cx,cy+r*.9,r*.8,r*.25,0,0,7);ctx.fill();
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,r,0,7);ctx.fill();
  ctx.strokeStyle='#5a3a1a';ctx.lineWidth=CS*.07;ctx.beginPath();ctx.moveTo(cx,cy-r*.8);ctx.lineTo(cx+r*.2,cy-r*1.2);ctx.stroke();
  ctx.fillStyle='#5fd35f';ctx.beginPath();ctx.ellipse(cx+r*.45,cy-r*1,r*.4,r*.2,-.5,0,7);ctx.fill();
}
function drawBonus(b,t){
  const cx=(b.x+.5)*CS,cy=(b.y+.5)*CS,r=CS*.4*(1+Math.sin(t*8)*.1);
  if(b.t<15&&Math.floor(t*8)%2)return;
  ctx.shadowColor='#ffd84a';ctx.shadowBlur=CS*.6;
  ctx.fillStyle='#ffd84a';ctx.beginPath();
  for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rad=i%2?r*.45:r;ctx.lineTo(cx+Math.cos(a)*rad,cy+Math.sin(a)*rad);}
  ctx.closePath();ctx.fill();ctx.shadowBlur=0;
}
function lerp(a,b,t){return a+(b-a)*t}
function draw(now){
  const t=now/1000,k=state==='play'?Math.min(1,acc/stepMs):1;
  drawBG();
  if(food)drawApple(food[0],food[1],t);
  if(bonus)drawBonus(bonus,t);
  // позиции с интерполяцией
  const pts=snake.map((s,i)=>{const p=prev[i]||s;return [lerp(p[0],s[0],k)+.5,lerp(p[1],s[1],k)+.5]});
  const n=pts.length;
  ctx.lineCap='round';ctx.lineJoin='round';
  // тень
  ctx.strokeStyle='#00000040';ctx.lineWidth=CS*.8;ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0]*CS+2,p[1]*CS+4):ctx.moveTo(p[0]*CS+2,p[1]*CS+4));ctx.stroke();
  // тело сегментами с градиентом от головы к хвосту
  for(let i=n-1;i>0;i--){
    const f=1-i/n;
    const w=CS*(.52+.3*Math.min(1,f*1.5)),
          c=`hsl(${95+f*30},${55+f*20}%,${34+f*16}%)`;
    ctx.strokeStyle=c;ctx.lineWidth=w;
    ctx.beginPath();ctx.moveTo(pts[i][0]*CS,pts[i][1]*CS);ctx.lineTo(pts[i-1][0]*CS,pts[i-1][1]*CS);ctx.stroke();
    // блик-узор
    if(i%2===0){ctx.strokeStyle='#ffffff18';ctx.lineWidth=w*.28;ctx.beginPath();ctx.moveTo(pts[i][0]*CS,pts[i][1]*CS-w*.18);ctx.lineTo(pts[i-1][0]*CS,pts[i-1][1]*CS-w*.18);ctx.stroke();}
  }
  // голова
  const hx=pts[0][0]*CS,hy=pts[0][1]*CS,hr=CS*.46;
  ctx.fillStyle='hsl(95,70%,52%)';ctx.beginPath();ctx.arc(hx,hy,hr,0,7);ctx.fill();
  const d=dir,px=-d[1],py=d[0];
  for(const s of[-1,1]){
    const ex=hx+d[0]*hr*.35+px*s*hr*.5,ey=hy+d[1]*hr*.35+py*s*hr*.5;
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ex,ey,hr*.3,0,7);ctx.fill();
    ctx.fillStyle='#111';ctx.beginPath();ctx.arc(ex+d[0]*hr*.1,ey+d[1]*hr*.1,hr*.15,0,7);ctx.fill();
  }
  // язык
  if(state==='play'&&Math.floor(t*3)%3===0){
    ctx.strokeStyle='#ff4d6d';ctx.lineWidth=CS*.08;ctx.beginPath();
    ctx.moveTo(hx+d[0]*hr,hy+d[1]*hr);ctx.lineTo(hx+d[0]*hr*1.6,hy+d[1]*hr*1.6);
    ctx.lineTo(hx+d[0]*hr*1.9+px*hr*.2,hy+d[1]*hr*1.9+py*hr*.2);ctx.moveTo(hx+d[0]*hr*1.6,hy+d[1]*hr*1.6);ctx.lineTo(hx+d[0]*hr*1.9-px*hr*.2,hy+d[1]*hr*1.9-py*hr*.2);ctx.stroke();
  }
  // частицы
  parts=parts.filter(p=>p.l>0);
  parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.08;p.l-=.03;ctx.globalAlpha=Math.max(0,p.l);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,CS*.12,0,7);ctx.fill();});
  ctx.globalAlpha=1;
}
let last=performance.now();
function loop(now){
  const dt=Math.min(100,now-last);last=now;
  if(state==='play'){acc+=dt;while(acc>=stepMs&&state==='play'){acc-=stepMs;step();}}
  draw(now);requestAnimationFrame(loop);
}

// ---- управление: свайп ----
let sx=null,sy=null;
function start(x,y){sx=x;sy=y}
function move(x,y){
  if(sx==null)return;
  const dx=x-sx,dy=y-sy;
  if(Math.max(Math.abs(dx),Math.abs(dy))>16){
    turn(Math.abs(dx)>Math.abs(dy)?(dx>0?DIRS.r:DIRS.l):(dy>0?DIRS.d:DIRS.u));
    sx=x;sy=y;
  }
}
document.body.addEventListener('touchstart',e=>{const t=e.touches[0];start(t.clientX,t.clientY);if(state==='over'){reset();}},{passive:true});
document.body.addEventListener('touchmove',e=>{e.preventDefault();const t=e.touches[0];move(t.clientX,t.clientY)},{passive:false});
document.body.addEventListener('touchend',()=>{sx=null});
document.body.addEventListener('mousedown',e=>{start(e.clientX,e.clientY);if(state==='over')reset();});
document.body.addEventListener('mousemove',e=>{if(e.buttons)move(e.clientX,e.clientY)});
document.body.addEventListener('mouseup',()=>{sx=null});
addEventListener('keydown',e=>{
  const m={ArrowUp:DIRS.u,ArrowDown:DIRS.d,ArrowLeft:DIRS.l,ArrowRight:DIRS.r,w:DIRS.u,s:DIRS.d,a:DIRS.l,d:DIRS.r};
  if(m[e.key]){if(state==='over')reset();turn(m[e.key]);e.preventDefault();}
});
addEventListener('resize',()=>{if(state!=='play'){size();reset();}});
document.addEventListener('visibilitychange',()=>{last=performance.now()});
size();reset();requestAnimationFrame(loop);
if(location.hash==='#test')window.__t={get s(){return {state,score,snake,ROWS}},turn,DIRS,setFood(x,y){food=[x,y]}};
</script></body></html>
