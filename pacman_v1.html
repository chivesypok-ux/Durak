<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Pac-Man</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:#000;color:#fff;font-family:system-ui,sans-serif;overflow:hidden;touch-action:none}
#app{display:flex;flex-direction:column;align-items:center;height:100%;padding:6px}
#hud{display:flex;justify-content:space-between;width:100%;max-width:440px;font-weight:700;font-size:15px;color:#ffd800;padding:2px 6px}
#wrap{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;position:relative}
canvas{background:#000;max-width:100%;max-height:100%}
#msg{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;font-size:22px;font-weight:800;color:#ffd800;text-shadow:0 0 8px #000;pointer-events:none;white-space:pre-line}
#pad{display:grid;grid-template-columns:repeat(3,60px);grid-template-rows:repeat(2,52px);gap:6px;margin:6px 0 10px}
#pad button{background:#1a1a5c;border:2px solid #2f2fd0;border-radius:12px;color:#ffd800;font-size:22px}
#pad button:active{background:#2f2fd0}
#u{grid-column:2;grid-row:1}#l{grid-column:1;grid-row:2}#d{grid-column:2;grid-row:2}#r{grid-column:3;grid-row:2}
</style></head><body>
<div id="app">
<div id="hud"><span id="sc">0</span><span id="lv">Ур. 1</span><span id="li"></span><span id="hi">Рекорд 0</span></div>
<div id="wrap"><canvas id="c"></canvas><div id="msg"></div></div>
<div id="pad"><button id="u">▲</button><button id="l">◀</button><button id="d">▼</button><button id="r">▶</button></div>
</div>
<script>
try{Telegram.WebApp.ready();Telegram.WebApp.expand();Telegram.WebApp.disableVerticalSwipes&&Telegram.WebApp.disableVerticalSwipes()}catch(e){}
const MAP=[
"###################",
"#........#........#",
"#o##.###.#.###.##o#",
"#.................#",
"#.##.#.#####.#.##.#",
"#....#...#...#....#",
"####.### # ###.####",
"   #.#       #.#   ",
"####.# ##-## #.####",
"    .  #GGG#  .    ",
"####.# ##### #.####",
"   #.#       #.#   ",
"####.# ##### #.####",
"#........#........#",
"#.##.###.#.###.##.#",
"#o.#.....P.....#.o#",
"##.#.#.#####.#.#.##",
"#....#...#...#....#",
"#.######.#.######.#",
"#.................#",
"###################"];
const W=19,H=21;
MAP.forEach(r=>{if(r.length!==W)throw "bad row "+r});
const DIRS=[[0,-1],[-1,0],[0,1],[1,0]]; // up left down right
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
let S=24;
function resize(){
  const w=$('wrap').clientWidth,h=$('wrap').clientHeight;
  S=Math.max(10,Math.floor(Math.min(w/W,h/H)));
  const dpr=window.devicePixelRatio||1;
  cv.width=W*S*dpr;cv.height=H*S*dpr;cv.style.width=W*S+'px';cv.style.height=H*S+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener('resize',resize);

let grid,dots,score,lives,level,hi=+(localStorage.getItem('pac_hi')||0),state,stateT,pac,ghosts,modeT,fright,eatChain,fruitT;
const GH=[
 {c:'#ff0000',corner:[17,0],home:[9,7],delay:0},
 {c:'#ffb8ff',corner:[1,0],home:[9,9],delay:2},
 {c:'#00ffff',corner:[17,20],home:[8,9],delay:5},
 {c:'#ffb852',corner:[1,20],home:[10,9],delay:8}];

function loadLevel(){
  grid=MAP.map(r=>r.split(''));dots=0;
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){const t=grid[y][x];if(t==='.'||t==='o')dots++;}
}
function resetActors(){
  pac={x:9,y:15,d:0,dx:0,dy:0,p:0,want:-1,speed:5.6+Math.min(level,6)*.25,mouth:0,dead:0};
  ghosts=GH.map((g,i)=>({i,c:g.c,corner:g.corner,x:g.home[0],y:g.home[1],d:-1,dx:0,dy:0,p:0,
    st:i===0?'norm':'wait',t:g.delay,eyes:false}));
  modeT=0;fright=0;eatChain=0;
}
function newGame(){score=0;lives=3;level=1;loadLevel();resetActors();setState('ready');}
function setState(s){state=s;stateT=0;
  $('msg').textContent=s==='ready'?'Готов?':s==='over'?'Игра окончена\nКоснись для новой':s==='win'?'Уровень пройден!':'';}
function wall(x,y,door){
  if(y<0||y>=H)return true;
  if(x<0||x>=W)return !(y===9); // tunnel only on row 9
  const t=grid[y][x];
  if(t==='#')return true;
  if(t==='-')return !door;
  return false;
}
function wrapX(e){if(e.x<0)e.x=W-1;else if(e.x>=W)e.x=0;}

function movePac(dt){
  const e=pac;e.mouth+=dt*14;
  let left=e.speed*dt;
  while(left>0){
    if(e.d>=0&&(e.dx||e.dy)){
      // reverse instantly
      if(e.want>=0&&e.want===(e.d+2)%4){e.x+=e.dx;e.y+=e.dy;e.d=e.want;e.dx=DIRS[e.d][0];e.dy=DIRS[e.d][1];e.p=1-e.p;}
      const step=Math.min(left,1-e.p);e.p+=step;left-=step;
      if(e.p>=1-1e-9){e.p=0;e.x+=e.dx;e.y+=e.dy;wrapX(e);eat();arrive(e);}
    }else{arrive(e);if(!(e.dx||e.dy))break;}
  }
}
function arrive(e){
  let nd=-1;
  if(e.want>=0&&!wall(e.x+DIRS[e.want][0],e.y+DIRS[e.want][1],false))nd=e.want;
  else if(e.d>=0&&!wall(e.x+DIRS[e.d][0],e.y+DIRS[e.d][1],false))nd=e.d;
  if(nd<0){e.dx=e.dy=0;e.d=e.d;return;}
  e.d=nd;e.dx=DIRS[nd][0];e.dy=DIRS[nd][1];
}
function eat(){
  const t=grid[pac.y]&&grid[pac.y][pac.x];
  if(t==='.'){grid[pac.y][pac.x]=' ';score+=10;dots--;}
  else if(t==='o'){grid[pac.y][pac.x]=' ';score+=50;dots--;
    fright=Math.max(2.5,8-level*.7);eatChain=0;
    ghosts.forEach(g=>{if(g.st==='norm'){g.fr=true;g.d=g.d>=0?(g.d+2)%4:-1; if(g.d>=0){g.dx=DIRS[g.d][0];g.dy=DIRS[g.d][1];g.x+=0;}}});}
  if(score>hi){hi=score;try{localStorage.setItem('pac_hi',hi)}catch(e){}}
}

function bfs(sx,sy,tx,ty,door){
  const q=[[sx,sy]],prev={};prev[sx+','+sy]=null;
  while(q.length){
    const [x,y]=q.shift();
    if(x===tx&&y===ty){
      let k=x+','+y,p=prev[k],last=[x,y];
      while(p&&prev[p[0]+','+p[1]]){last=p;p=prev[p[0]+','+p[1]];}
      const f=p?last:[x,y];
      for(let d=0;d<4;d++)if(sx+DIRS[d][0]===f[0]&&sy+DIRS[d][1]===f[1])return d;
      // wrap case
      return -1;
    }
    for(let d=0;d<4;d++){
      let nx=x+DIRS[d][0],ny=y+DIRS[d][1];
      if(nx<0||nx>=W){ if(y!==9)continue; nx=(nx+W)%W;}
      if(wall(nx,ny,door))continue;
      const k=nx+','+ny;if(k in prev)continue;prev[k]=[x,y];q.push([nx,ny]);
    }
  }
  return -1;
}
function target(g){
  if(modeT%27<7&&!g.fr) return g.corner;
  const px=pac.x,py=pac.y,pd=pac.d>=0?DIRS[pac.d]:[0,0];
  if(g.i===0)return [px,py];
  if(g.i===1)return [px+pd[0]*4,py+pd[1]*4];
  if(g.i===2){const r=ghosts[0];return [px+pd[0]*2+(px+pd[0]*2-r.x),py+pd[1]*2+(py+pd[1]*2-r.y)];}
  return Math.hypot(px-g.x,py-g.y)>6?[px,py]:g.corner;
}
function ghostChoose(g){
  let nd=-1;
  const door=g.st==='leave'||g.eyes;
  if(g.eyes){nd=bfs(g.x,g.y,9,9,true);}
  else if(g.st==='leave'){nd=bfs(g.x,g.y,9,7,true);}
  else{
    const opts=[];
    for(let d=0;d<4;d++){
      if(g.d>=0&&d===(g.d+2)%4)continue;
      const nx=g.x+DIRS[d][0],ny=g.y+DIRS[d][1];
      if(wall(nx,ny,false))continue;
      opts.push(d);
    }
    if(!opts.length){ if(g.d>=0)opts.push((g.d+2)%4); else opts.push(0);}
    if(g.fr)nd=opts[Math.floor(Math.random()*opts.length)];
    else{
      const t=target(g);let best=1e9;
      for(const d of opts){
        const nx=g.x+DIRS[d][0],ny=g.y+DIRS[d][1];
        const dist=(nx-t[0])**2+(ny-t[1])**2;
        if(dist<best){best=dist;nd=d;}
      }
    }
  }
  if(nd<0){g.dx=g.dy=0;return;}
  g.d=nd;g.dx=DIRS[nd][0];g.dy=DIRS[nd][1];
}
function moveGhost(g,dt){
  if(g.st==='wait'){g.t-=dt;if(g.t<=0)g.st='leave';else return;}
  let sp=g.eyes?12:g.fr?2.8:(4.6+Math.min(level,6)*.25);
  if(g.y===9&&(g.x<4||g.x>14))sp*=.6;
  let left=sp*dt;
  while(left>0){
    if(!(g.dx||g.dy)){ghostChoose(g);if(!(g.dx||g.dy))break;}
    const step=Math.min(left,1-g.p);g.p+=step;left-=step;
    if(g.p>=1-1e-9){
      g.p=0;g.x+=g.dx;g.y+=g.dy;wrapX(g);
      if(g.eyes&&g.x===9&&g.y===9){g.eyes=false;g.fr=false;g.st='leave';}
      if(g.st==='leave'&&g.x===9&&g.y===7)g.st='norm';
      ghostChoose(g);
    }
  }
}
function update(dt){
  stateT+=dt;
  if(state==='ready'){if(stateT>1.6)setState('play');return;}
  if(state==='dying'){pac.dead=Math.min(1,stateT/1.2);if(stateT>1.6){
      lives--; if(lives<=0)setState('over'); else{resetActors();setState('ready');}} return;}
  if(state==='win'){if(stateT>1.8){level++;loadLevel();resetActors();setState('ready');}return;}
  if(state!=='play')return;
  modeT+=dt;
  if(fright>0){fright-=dt;if(fright<=0){ghosts.forEach(g=>g.fr=false);}}
  movePac(dt);
  ghosts.forEach(g=>moveGhost(g,dt));
  // collisions
  for(const g of ghosts){
    const gx=g.x+g.dx*g.p,gy=g.y+g.dy*g.p,px=pac.x+pac.dx*pac.p,py=pac.y+pac.dy*pac.p;
    if(Math.hypot(gx-px,gy-py)<.6&&!g.eyes&&g.st!=='wait'){
      if(g.fr){g.eyes=true;g.fr=false;eatChain++;score+=100*Math.pow(2,eatChain);
        if(score>hi){hi=score;try{localStorage.setItem('pac_hi',hi)}catch(e){}}
        g.dx=g.dy=0;g.p=0;try{Telegram.WebApp.HapticFeedback.impactOccurred('light')}catch(e){}}
      else{setState('dying');try{Telegram.WebApp.HapticFeedback.notificationOccurred('error')}catch(e){};return;}
    }
  }
  if(dots<=0)setState('win');
}

function wallPath(){
  ctx.lineWidth=Math.max(2,S*.14);ctx.strokeStyle='#2121de';ctx.lineJoin='round';
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    if(MAP[y][x]!=='#')continue;
    const r=(a,b)=>{const xx=x+a,yy=y+b;return xx>=0&&xx<W&&yy>=0&&yy<H&&MAP[yy][xx]==='#';};
    const x0=x*S,y0=y*S;
    ctx.fillStyle='#050538';ctx.fillRect(x0,y0,S,S);
    ctx.beginPath();
    const m=ctx.lineWidth/2;
    if(!r(0,-1)){ctx.moveTo(x0,y0+m);ctx.lineTo(x0+S,y0+m);}
    if(!r(0,1)){ctx.moveTo(x0,y0+S-m);ctx.lineTo(x0+S,y0+S-m);}
    if(!r(-1,0)){ctx.moveTo(x0+m,y0);ctx.lineTo(x0+m,y0+S);}
    if(!r(1,0)){ctx.moveTo(x0+S-m,y0);ctx.lineTo(x0+S-m,y0+S);}
    ctx.stroke();
  }
}
let wallCache=null;
function drawGhost(g,t){
  const gx=(g.x+g.dx*g.p+.5)*S,gy=(g.y+g.dy*g.p+.5)*S,r=S*.46;
  if(!g.eyes){
    let col=g.c;
    if(g.fr){col=(fright<2&&Math.floor(t*6)%2)?'#fff':'#2121ff';}
    ctx.fillStyle=col;ctx.beginPath();
    ctx.arc(gx,gy-r*.1,r,Math.PI,0);
    ctx.lineTo(gx+r,gy+r);
    const n=3,w=2*r/n,ph=Math.floor(t*8)%2;
    for(let i=0;i<n;i++){const xx=gx+r-(i+.5)*w;ctx.lineTo(xx,gy+r-(i+ph)%2*r*.3-r*.05);ctx.lineTo(gx+r-(i+1)*w,gy+r);}
    ctx.closePath();ctx.fill();
  }
  const dd=g.d>=0?DIRS[g.d]:[0,0];
  if(g.fr&&!g.eyes){
    ctx.fillStyle='#ffd0b0';[-1,1].forEach(s=>{ctx.fillRect(gx+s*r*.38-S*.05,gy-r*.3,S*.1,S*.1);});
  }else{
    [-1,1].forEach(s=>{
      ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(gx+s*r*.4,gy-r*.2,r*.28,r*.36,0,0,7);ctx.fill();
      ctx.fillStyle='#1a1aff';ctx.beginPath();ctx.arc(gx+s*r*.4+dd[0]*r*.14,gy-r*.2+dd[1]*r*.2,r*.15,0,7);ctx.fill();
    });
  }
}
function draw(t){
  ctx.clearRect(0,0,W*S,H*S);
  if(!wallCache||wallCache.S!==S){
    const oc=document.createElement('canvas');oc.width=cv.width;oc.height=cv.height;
    const save=ctx.canvas;
    wallCache={S,c:oc};
    const octx=oc.getContext('2d');octx.setTransform(cv.width/(W*S),0,0,cv.width/(W*S),0,0);
    const real=ctx;
    // draw walls into offscreen
    const tmp=window.ctx2=octx;
    drawWallsOn(octx);
  }
  ctx.drawImage(wallCache.c,0,0,W*S,H*S);
  // dots
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const k=grid[y][x];
    if(k==='.'){ctx.fillStyle='#ffb8ae';ctx.fillRect((x+.5)*S-S*.08,(y+.5)*S-S*.08,S*.16,S*.16);}
    else if(k==='o'&&Math.floor(t*4)%2===0){ctx.fillStyle='#ffb8ae';ctx.beginPath();ctx.arc((x+.5)*S,(y+.5)*S,S*.3,0,7);ctx.fill();}
    else if(k==='-'){ctx.fillStyle='#ffb8de';ctx.fillRect(x*S,(y+.4)*S,S,S*.2);}
  }
  // pac
  const px=(pac.x+pac.dx*pac.p+.5)*S,py=(pac.y+pac.dy*pac.p+.5)*S,r=S*.47;
  const ang=pac.d>=0?[-Math.PI/2,Math.PI,Math.PI/2,0][pac.d]:0;
  let m=state==='dying'?pac.dead*Math.PI:(Math.abs(Math.sin(pac.mouth))*.85+.05)*(pac.dx||pac.dy||state!=='play'?1:.3)*.5;
  if(state==='ready')m=.3;
  ctx.fillStyle='#ffd800';ctx.beginPath();
  if(state==='dying'&&pac.dead>=1){}
  else{ctx.moveTo(px,py);ctx.arc(px,py,r,ang+m,ang+2*Math.PI-m);ctx.closePath();ctx.fill();}
  if(state!=='dying')ghosts.forEach(g=>drawGhost(g,t));
  else if(stateT<.5)ghosts.forEach(g=>drawGhost(g,t));
  // hud
  $('sc').textContent=score;$('lv').textContent='Ур. '+level;$('hi').textContent='Рекорд '+hi;
  $('li').textContent='●'.repeat(Math.max(0,lives));
}
function drawWallsOn(c){
  const save=ctx;
  // temporarily swap global ctx used by wallPath
  window.__c=c;
  const orig=ctx;
  // reimplement by calling with local context
  c.lineWidth=Math.max(2,S*.14);c.strokeStyle='#2121de';c.lineJoin='round';
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    if(MAP[y][x]!=='#')continue;
    const r=(a,b)=>{const xx=x+a,yy=y+b;return xx>=0&&xx<W&&yy>=0&&yy<H&&MAP[yy][xx]==='#';};
    const x0=x*S,y0=y*S,m=c.lineWidth/2;
    c.fillStyle='#050538';c.fillRect(x0,y0,S,S);
    c.beginPath();
    if(!r(0,-1)){c.moveTo(x0,y0+m);c.lineTo(x0+S,y0+m);}
    if(!r(0,1)){c.moveTo(x0,y0+S-m);c.lineTo(x0+S,y0+S-m);}
    if(!r(-1,0)){c.moveTo(x0+m,y0);c.lineTo(x0+m,y0+S);}
    if(!r(1,0)){c.moveTo(x0+S-m,y0);c.lineTo(x0+S-m,y0+S);}
    c.stroke();
  }
}
// input
function setDir(d){
  if(state==='over'){newGame();return;}
  pac.want=d;
}
const KEY={ArrowUp:0,ArrowLeft:1,ArrowDown:2,ArrowRight:3,w:0,a:1,s:2,d:3};
addEventListener('keydown',e=>{if(e.key in KEY){setDir(KEY[e.key]);e.preventDefault();}});
[['u',0],['l',1],['d',2],['r',3]].forEach(([id,d])=>{
  const b=$(id);b.addEventListener('touchstart',e=>{e.preventDefault();setDir(d)},{passive:false});
  b.addEventListener('mousedown',()=>setDir(d));
});
let sx,sy;
const area=$('wrap');
area.addEventListener('touchstart',e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY;if(state==='over')newGame();},{passive:true});
area.addEventListener('touchmove',e=>{
  if(sx==null)return;const t=e.touches[0],dx=t.clientX-sx,dy=t.clientY-sy;
  if(Math.max(Math.abs(dx),Math.abs(dy))>18){
    setDir(Math.abs(dx)>Math.abs(dy)?(dx>0?3:1):(dy>0?2:0));sx=t.clientX;sy=t.clientY;}
},{passive:true});
area.addEventListener('touchend',()=>{sx=null});
area.addEventListener('click',()=>{if(state==='over')newGame();});

let last=performance.now();
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  update(dt);draw(now/1000);requestAnimationFrame(loop);
}
resize();newGame();requestAnimationFrame(loop);
if(location.hash==='#test')window.__t={update,get s(){return {state,score,dots,lives,pac,ghosts}},setDir,newGame};
</script></body></html>
