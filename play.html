<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Дурак</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--felt:#0f5132;--felt2:#0b3d26;--ink:#0b0b0b;--red:#c62828;--paper:#fbfaf6;--gold:#e8c35a;--cw:clamp(56px,18vw,88px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;background:var(--felt);color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}
#app{height:100dvh;display:grid;grid-template-rows:auto auto 1fr auto auto;background:radial-gradient(ellipse at 50% 40%,#177048 0,var(--felt) 55%,var(--felt2) 100%);max-width:560px;margin:0 auto;padding:8px 10px calc(10px + env(safe-area-inset-bottom))}
.top{white-space:nowrap;display:flex;justify-content:space-between;align-items:center;font-size:13px;opacity:.9;gap:8px}
.top button{background:#ffffff22;color:#fff;border:0;border-radius:10px;padding:6px 8px;font-size:12px}
.top span{font-size:12px}
.hand{display:flex;justify-content:center;min-height:calc(var(--cw)*.9);padding-top:6px}
.hand.bot{align-items:flex-start}
.hand.bot .card{margin-left:calc(var(--cw)*-.62);height:calc(var(--cw)*.9);overflow:hidden}
.hand.bot .card:first-child{margin-left:0}
.hand.me{overflow-x:auto;justify-content:flex-start;padding:10px 4px 4px;min-height:calc(var(--cw)*1.7)}
.hand.me::before,.hand.me::after{content:"";margin:auto}
.hand.me .card{flex:0 0 auto;margin-left:calc(var(--cw)*-.28)}
.hand.me .card:first-child{margin-left:0}
.mid{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:center;min-height:0}
#deckbox{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;opacity:.95;min-width:calc(var(--cw)*1.3)}
#deck{position:relative;width:calc(var(--cw)*1.25);height:calc(var(--cw)*1.45)}
#deck .card{position:absolute;left:0;top:0}
#deck .trumpcard{transform:rotate(90deg) translate(18%,-30%);left:10px;top:4px}
#deck .deckback{left:0;top:0}
.trumpsuit{font-size:48px;line-height:calc(var(--cw)*1.45);text-align:center;color:#fff}.trumpsuit.red{color:#ff8a80}
#table{display:flex;flex-wrap:wrap;gap:10px 8px;justify-content:center;align-content:center;min-height:calc(var(--cw)*3)}
.pair{position:relative;width:calc(var(--cw)*1.1);height:calc(var(--cw)*1.55)}
.pair .card{position:absolute;left:0;top:calc(var(--cw)*.1)}
.pair .def{left:calc(var(--cw)*.32);top:calc(var(--cw)*.28);transform:rotate(9deg);animation:pop .25s}
.pair.sel .card:first-child{outline:3px solid var(--gold)}
.card{width:var(--cw);height:calc(var(--cw)*1.4);background:var(--paper);color:var(--ink);border-radius:9px;box-shadow:0 2px 6px #0007,0 0 0 1px #0002 inset;position:relative;font-weight:700;animation:pop .22s;transition:transform .12s,opacity .12s}
.card.red{color:var(--red)}
.card b{position:absolute;left:5px;top:3px;font-size:calc(var(--cw)*.26);line-height:1;text-align:center}
.card b i{display:block;font-style:normal;font-size:calc(var(--cw)*.24)}
.card b.br{left:auto;right:5px;top:auto;bottom:3px;transform:rotate(180deg)}
.card span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:calc(var(--cw)*.6);opacity:.9}
.card.back{background:var(--backimg,repeating-linear-gradient(45deg,#2b4f9b 0 6px,#35609f 6px 12px));border:3px solid var(--paper)}
.card.ok{transform:translateY(-10px);box-shadow:0 4px 10px #0009,0 0 0 2px var(--gold)}
.card.no{filter:brightness(.72)}
.card.ok:active{transform:translateY(-16px)}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
.bar{display:flex;gap:8px;justify-content:center;align-items:center;min-height:44px}
.bar button{border:0;border-radius:14px;padding:11px 20px;font-size:16px;font-weight:700;color:#0b0b0b;background:var(--gold);box-shadow:0 2px 0 #0004}
.bar button.sec{background:#fff;color:#0b0b0b}
#status{text-align:center;font-size:14px;padding:4px 6px;min-height:22px}
#role{font-size:12px;opacity:.85;text-align:center}
</style></head>
<body><div id="app">
  <div class="top"><span id="stat"></span><span><button id="backbtn">🎴 Рубашка: <span id="backname"></span></button> <button id="restart">Новая игра</button></span></div>
  <div><div class="hand bot" id="bot"></div><div style="text-align:center;font-size:12px;opacity:.8">Бот: <span id="botcnt">6</span> карт</div></div>
  <div class="mid">
    <div id="deckbox"><div id="deck"></div><div id="decknum"></div></div>
    <div id="table"></div>
  </div>
  <div><div id="role"></div><div id="status"></div>
    <div class="bar"><button id="btnBeat" style="display:none">Бито</button><button id="btnTake" class="sec" style="display:none">Беру</button><button id="btnDone" style="display:none">Готово</button><button id="newgame" style="display:none">Играть ещё</button></div>
  </div>
  <div class="hand me" id="me"></div>
</div>
<script src="game_v2.js"></script>
</body></html>
